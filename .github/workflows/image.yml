name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==10.2.0
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 --tag ghcr.io/aelise08/text-me-hermes-agent:v1 .
      - name: Push
        run: docker push ghcr.io/aelise08/text-me-hermes-agent:v1
      - name: Digest and public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/aelise08/text-me-hermes-agent:v1)
          echo "pushed $digest"
          echo "$digest" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            gh api --method PATCH -H "Accept: application/vnd.github+json" \
              /user/packages/container/text-me-hermes-agent \
              -f visibility=public && break
            sleep 5
          done
