name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let an older main build finish later and replace :v1 with stale code.
  group: ghcr-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aelise08/text-me-hermes-agent

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==10.2.0
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            --tag "$IMAGE:v1" \
            --tag "$IMAGE:sha-${GITHUB_SHA}" .
      - name: Push
        run: |
          docker push "$IMAGE:v1"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
      - name: Digest and public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-${GITHUB_SHA}")
          echo "pushed $digest"
          {
            echo "## Published image"
            echo
            echo "\`$digest\`"
            echo
            echo "Tags: \`v1\`, \`sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          public=false
          for i in 1 2 3 4 5; do
            gh api --method PATCH -H "Accept: application/vnd.github+json" \
              /user/packages/container/text-me-hermes-agent \
              -f visibility=public && { public=true; break; }
            sleep 5
          done
          [ "$public" = true ] || { echo "could not make GHCR package public" >&2; exit 1; }
