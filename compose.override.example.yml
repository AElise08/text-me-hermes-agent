# Copy to compose.override.yml (gitignored) after minting a line.
# Timezone and delivery are the person's — they set those in chat.
# TZ here is only a fallback until the profile has a timezone.
#
# Calendar and Gmail without Latch: mount the plow-agents *account* token.
# The mint agent token cannot call Google (403).
services:
  agent:
    environment:
      AGENT_ID: text-me
      PLOW_CONNECTOR_TOKEN_FILE: /var/lib/plow/account.token
      # IANA zone, e.g. America/Belem, Europe/Lisbon, America/New_York
      # TZ: UTC
      # KINDLE_EMAIL: you@kindle.com
      # PRINTER_EMAIL: you@hpeprint.com
      # PRINTER_URI: ipp://printer.local/ipp/print
      # HERMES_PROVIDER: deepseek
      # HERMES_MODEL: deepseek-flash
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ${HOME}/.config/plow/token:/var/lib/plow/account.token:ro
